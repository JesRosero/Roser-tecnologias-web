<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roser Tecnologías — Diseño y fabricación</title>
<meta name="description" content="Roser Tecnologías. Diseño y fabricación. Explora nuestros productos, servicios, aplicaciones y proyectos.">
<link rel="icon" href="/Imagenes/Rosero.png">
<link rel="stylesheet" href="/src/estilos/tema.css">
<link rel="stylesheet" href="/src/estilos/base.css">
<link rel="stylesheet" href="/src/paginas/inicio/inicio.css">
<script type="module" src="/src/paginas/inicio/inicio.js"></script>
</head>
<body>
<a class="saltar" href="#contenido">Ir al contenido</a>
<header id="cabecera"></header>
<main id="contenido">
<section class="portada contenedor" aria-labelledby="titulo-inicio">
<div class="portada-texto"><p class="marca" id="marca">Roser Tecnologías</p>
<h1 id="titulo-inicio">Diseño y fabricación</h1><p class="lema" id="lema">Lo piensas, lo haces.</p>
<a class="boton" id="explorar" href="#areas">Explorar nuestras áreas <span aria-hidden="true">↗</span></a></div>
<div class="portada-visual" aria-hidden="true"><img src="/assets/imagenes/inicio/hero.webp" alt="" id="imagen-hero" hidden></div>
</section>
<section id="areas" class="contenedor areas" aria-label="Áreas de Roser Tecnologías"><div class="areas-grid" id="tarjetas"></div></section>
<section id="contacto" class="contacto"><div class="contenedor contacto-grid">
<div><h2 id="contacto-titulo">Contáctanos</h2><address class="datos-contacto">
<a id="correo"></a><a id="telefono"></a><p id="ubicacion"></p></address></div>
<form id="form-contacto"><div class="campos-fila">
<label><span id="etiqueta-nombre">Nombre</span><input name="nombre" autocomplete="name" required maxlength="120"></label>
<label><span id="etiqueta-correo">Correo electrónico</span><input name="correo" type="email" autocomplete="email" required maxlength="254"></label></div>
<label><span id="etiqueta-mensaje">Mensaje</span><textarea name="mensaje" rows="3" required maxlength="3000"></textarea></label>
<button class="boton boton-whatsapp" type="submit" id="enviar" disabled>Enviar por WhatsApp</button>
</form></div></section>
<section class="contenedor mapa" aria-label="Ubicación de Roser Tecnologías"><iframe title="Ubicación de Roser Tecnologías en Google Maps" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d490.8!2d-77.3345241!3d1.7407476!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e2ef979ba659ab1%3A0x42ce07ecbb6e218a!2sRoser+Tecnologias!5e1!3m2!1ses!2sco!4v1" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe></section>
<p class="contenedor" id="estado" role="status" hidden></p>
